plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.firecast.castv2'
    compileSdk 34

    defaultConfig {
        applicationId "dev.firecast.castv2"
        minSdk 25
        targetSdk 34
        // CI passes -PversionCode / -PversionName derived from the release tag
        versionCode(project.findProperty('versionCode')?.toInteger() ?: 1)
        versionName(project.findProperty('versionName') ?: "0.1.0")
    }

    // Release signing comes from env vars (set by CI from repo secrets).
    // Without them, assembleRelease produces an unsigned APK.
    def releaseKeystore = System.getenv('FIRELINK_KEYSTORE_PATH')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('FIRELINK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FIRELINK_KEY_ALIAS')
                keyPassword System.getenv('FIRELINK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources {
            excludes += ['META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF', 'META-INF/BC2048KE.DSA', 'META-INF/BC2048KE.SF']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
}
